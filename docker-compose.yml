services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DEMO_MYSQL_ROOT_PASSWORD:-mordisco-demo-root}
      MYSQL_DATABASE: mordisco
      MYSQL_USER: mordisco_user
      MYSQL_PASSWORD: ${DEMO_DB_PASSWORD:-mordisco-demo-pass}
      TZ: America/Argentina/Buenos_Aires
    command: --default-time-zone='-03:00' --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - mordisco-network

  backend:
    build:
      context: ./mordisco-api
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DATABASE_URL: jdbc:mysql://mysql:3306/mordisco?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&characterEncoding=UTF-8&useUnicode=true
      DATABASE_USERNAME: mordisco_user
      DATABASE_PASSWORD: ${DEMO_DB_PASSWORD:-mordisco-demo-pass}
      SERVER_PORT: 8080
      FRONTEND_URL: http://localhost:4200
      WEBSOCKET_ALLOWED_ORIGINS: ${WEBSOCKET_ALLOWED_ORIGINS:-http://localhost:4200}
      HTTP_ALLOWED_ORIGINS: ${HTTP_ALLOWED_ORIGINS:-http://localhost:4200}
      JWT_SECRET: ${JWT_SECRET:?start.sh must generate or receive JWT_SECRET before startup}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_USERNAME: ""
      SPRING_MAIL_PASSWORD: ""
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY:-}
      MERCADOPAGO_NOTIFICATION_URL: ${MERCADOPAGO_NOTIFICATION_URL:-http://localhost:8080/api/pagos/webhook}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mordisco-network
    restart: unless-stopped

  frontend:
    build:
      context: ./mordisco-front
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - backend
    networks:
      - mordisco-network
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - mordisco-network
    restart: unless-stopped

  probe:
    image: curlimages/curl:8.12.1
    entrypoint: ["curl"]
    profiles: ["tools"]
    networks:
      - mordisco-network

volumes:
  mysql_data:
    driver: local

networks:
  mordisco-network:
    driver: bridge
