# Local recruiter demo profile: outbound mail is captured by the Compose Mailpit service.
app.mail.from=${APP_MAIL_FROM:mordisco-demo@example.test}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=false

# This profile is intended only for loopback-accessed demo environments.
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.websocket-allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:4200}
