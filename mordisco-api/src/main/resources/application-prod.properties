# TiDB Cloud is reached through its MySQL-compatible Connector/J endpoint.
# These values intentionally have no usable defaults: production must receive them
# from the deployment environment and must not contain credentials in this repository.
# Empty fallbacks are validation sentinels that let the profile validator emit a
# property-specific, non-secret startup diagnostic when a value is missing or blank.
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}

# Copy the complete provider-issued JDBC URL into DATABASE_URL. It must retain the
# provider's TLS parameters (for example, sslMode=VERIFY_IDENTITY); this application
# deliberately does not append query parameters to avoid corrupting an existing URL.
# Keep the driver-level requirement as a second guard for every production connection.
spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY

# Small, scale-to-zero-friendly pool. Each value can be tuned by the deployment
# environment without changing source; defaults deliberately avoid idle connections.
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:4}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:60000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:300000}

# Safe default: production always validates an already bootstrapped schema and fails
# startup on drift. Schema creation is opt-in through the explicit schema-bootstrap
# profile; activate prod,schema-bootstrap for one controlled startup, then return to prod.
spring.jpa.hibernate.ddl-auto=validate

# Legacy data.sql is non-idempotent and is never replayed in production.
# Recruiter fixtures require the explicit one-time prod,schema-bootstrap,demo-seed
# profile against a disposable Preview database; normal prod never seeds or resets data.
spring.sql.init.mode=never

# Vercel terminates TLS at the edge; the container serves plain HTTP.
server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=framework
server.ssl.enabled=false

# The API is stateless, but keep any servlet cookies safe in production.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Same-origin production topology and external service values.
app.frontend-url=${FRONTEND_URL}
app.websocket-allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:${FRONTEND_URL}}
app.maintenance-secret=${MAINTENANCE_SECRET:}
OPENWEATHERMAP_API_KEY=${OPENWEATHERMAP_API_KEY}

# Mercado Pago production configuration is intentionally explicit. The portfolio
# deployment uses sandbox credentials by setting MERCADOPAGO_ENVIRONMENT=sandbox;
# switch to production only with production credentials and an HTTPS notification URL.
app.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
app.mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}
app.mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
app.mercadopago.notification-url=${MERCADOPAGO_NOTIFICATION_URL:}
app.mercadopago.environment=${MERCADOPAGO_ENVIRONMENT:sandbox}

# Bound SMTP timeouts keep synchronous portfolio notifications from hanging a request.
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:5000}

# Swagger is not part of the production surface.
springdoc.api-docs.enabled=false
