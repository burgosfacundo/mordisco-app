spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

#Database properties
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Hibernate properties
spring.jpa.hibernate.ddl-auto=update

# Server properties
server.port=${PORT:${SERVER_PORT:8080}}

# Email properties
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:5000}
spring.mail.default-encoding=UTF-8

#Security properties
app.jwt.secret=${JWT_SECRET}
app.jwt.access.expiration=900000
app.jwt.refresh.expiration=2592000000
app.jwt.max-sessions=5
app.password-recovery.expiration-seconds=${PASSWORD_RECOVERY_EXPIRATION_SECONDS:3600}
app.password-recovery.cooldown-seconds=${PASSWORD_RECOVERY_COOLDOWN_SECONDS:300}

#Cache properties
spring.cache.type= caffeine
caffeine.spec= maximumSize=2000,expireAfterWrite=7d

app.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN}
app.mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY}
app.mercadopago.notification-url=${MERCADOPAGO_NOTIFICATION_URL:}
app.mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
app.mercadopago.environment=${MERCADOPAGO_ENVIRONMENT:sandbox}
app.frontend-url= ${FRONTEND_URL}
app.websocket-allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:}


