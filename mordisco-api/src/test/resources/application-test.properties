# Isolated test-only configuration. Values are synthetic and do not identify a real service.
spring.datasource.url=jdbc:mysql://127.0.0.1:1/synthetic_mordisco_test
spring.datasource.username=synthetic-test-user
spring.datasource.password=synthetic-test-password
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=250
spring.datasource.hikari.initialization-fail-timeout=-1

# Context-loading tests do not exercise persistence; avoid opening a database connection.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.sql.init.mode=never

server.port=0

# Mail is bound to an unroutable local test port; no real credentials are used.
spring.mail.host=127.0.0.1
spring.mail.port=2525
spring.mail.username=synthetic-test@example.invalid
spring.mail.password=synthetic-mail-password
spring.mail.properties.mail.smtp.connectiontimeout=100
spring.mail.properties.mail.smtp.timeout=100
spring.mail.properties.mail.smtp.writetimeout=100

app.frontend-url=http://localhost:4200
app.websocket-allowed-origins=http://localhost:4200
app.maintenance-secret=synthetic-maintenance-secret
app.jwt.secret=synthetic-test-jwt-secret-with-at-least-32-characters
app.jwt.access.expiration=900000
app.jwt.refresh.expiration=2592000000
app.jwt.max-sessions=5
app.password-recovery.expiration-seconds=3600
app.password-recovery.cooldown-seconds=300

app.mercadopago.access-token=synthetic-mercadopago-access-token
app.mercadopago.public-key=synthetic-mercadopago-public-key
app.mercadopago.webhook-secret=synthetic-mercadopago-webhook-secret
app.mercadopago.notification-url=https://synthetic.example.invalid/api/pagos/webhook
app.mercadopago.environment=sandbox
OPENWEATHERMAP_API_KEY=synthetic-openweathermap-key
