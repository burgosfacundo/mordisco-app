name: Bug report
description: Report a reproducible defect with evidence and acceptance criteria.
title: "[Bug] "
labels:
  - bug
  - phase
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the observed failure and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the starting state, commands, and sanitized output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Describe the smallest coherent fix and explicit non-goals.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Name checks that prove the issue can be closed.
    validations:
      required: true
