name: Release task
description: Track a bounded release-preparation task and its verification.
title: "[Release] "
labels:
  - phase
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What should this release task accomplish?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Specify the work included and what will not be changed.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions for completion.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: List the checks to run and any external or manual gates.
    validations:
      required: true
