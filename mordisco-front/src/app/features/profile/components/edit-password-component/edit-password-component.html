<form [formGroup]="editarPassword" (ngSubmit)="manejarModificacionPassword()" class="space-y-6">

  <fieldset class="form-field">
    <label for="passwordActual" class="form-label">Contraseña Actual</label>
    <div class="relative">
      <input
        [type]="showCurrentPassword ? 'text' : 'password'"
        id="passwordActual"
        placeholder="Ingresa tu contraseña actual"
        formControlName="passwordActual"
        class="form-input"
        [class.border-red-500]="getError('passwordActual')"
        [class.focus:ring-red-500]="getError('passwordActual')">
      <button
        type="button"
        (click)="toggleCurrentPasswordVisibility()"
        class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-gray-700"
        tabindex="-1">
        @if (showCurrentPassword) {
          <!-- Icono ojo cerrado -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
          </svg>
        } @else {
          <!-- Icono ojo abierto -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        }
      </button>
    </div>
    @if (getError('passwordActual')) {
      <p class="form-error">{{ getError('passwordActual') }}</p>
    }
  </fieldset>

  <div class="pt-4 border-t border-gray-200">
    <fieldset class="form-field">
      <label for="password" class="form-label">Contraseña Nueva</label>
      <div class="relative">
        <input
          [type]="showNewPassword ? 'text' : 'password'"
          id="password"
          formControlName="password"
          placeholder="Ingresa tu contraseña nueva"
          class="form-input"
          [class.border-red-500]="getError('password')"
          [class.focus:ring-red-500]="getError('password')">
        <button
          type="button"
          (click)="toggleNewPasswordVisibility()"
          class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-gray-700"
          tabindex="-1">
          @if (showNewPassword) {
            <!-- Icono ojo cerrado -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          } @else {
            <!-- Icono ojo abierto -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          }
        </button>
      </div>
      @if (getError('password')) {
        <p class="form-error">{{ getError('password') }}</p>
      }

    </fieldset>

    <fieldset class="form-field">
      <label for="confirmarPasswordNueva" class="form-label">Confirmar Contraseña Nueva</label>
      <div class="relative">
        <input
          [type]="showConfirmPassword ? 'text' : 'password'"
          id="confirmarPasswordNueva"
          placeholder="Repite la contraseña"
          formControlName="confirmarPasswordNueva"
          class="form-input"
          [class.border-red-500]="getError('confirmarPasswordNueva')"
          [class.focus:ring-red-500]="getError('confirmarPasswordNueva')">
        <button
          type="button"
          (click)="toggleConfirmPasswordVisibility()"
          class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-gray-700"
          tabindex="-1">
          @if (showConfirmPassword) {
            <!-- Icono ojo cerrado -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          } @else {
            <!-- Icono ojo abierto -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          }
        </button>
      </div>
      @if (getError('confirmarPasswordNueva')) {
        <p class="form-error">{{ getError('confirmarPasswordNueva') }}</p>
      }
    </fieldset>
  </div>

  <div class="flex flex-col sm:flex-row gap-4 pt-6">
    <button 
      type="button"
      [routerLink]="['/profile']"
      class="btn-outline flex-1 order-2 sm:order-1">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
      Cancelar
    </button>
    
    <button 
      type="submit" 
      [disabled]="editarPassword.invalid || isSubmitting()" 
      class="btn-primary flex-1 order-1 sm:order-2">
      @if (isSubmitting()) {
        <span class="inline-flex items-center justify-center gap-2">
          <span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          Guardando...
        </span>
      } @else {
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        Cambiar Contraseña
      }
    </button>
  </div> 

</form>
