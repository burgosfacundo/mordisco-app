<section class="flex min-h-screen w-full bg-stone-50">
  <!-- Mitad izquierda: Imagen con color rojo (desktop only) -->
  <div class="hidden lg:flex lg:w-1/2 h-screen items-center justify-center" style="background-color: #E3291D;">
    <img 
      src="https://res.cloudinary.com/dyzhap5j4/image/upload/v1761055103/PHOTO-2025-10-21-10-57-39_hyomts.jpg" 
      alt="Mordisco Delivery" 
      class="w-96 h-auto object-contain">
  </div>

  <!-- Mitad derecha: Contenido -->
  <div class="w-full lg:w-1/2 flex flex-col items-center justify-center px-4 py-8 lg:py-0">
    <h1 class="font-display text-5xl md:text-6xl font-bold mb-4 tracking-tight" style="color: #E3291D;">
      MORDISCO
    </h1>
    <p class="text-gray-600 mb-8 text-center">Establece tu nueva contraseña</p>
    
    <!-- Formulario -->
    <form 
      [formGroup]="resetForm" 
      (ngSubmit)="resetearPassword()" 
      class="form-container">
      
      <fieldset class="form-field">
        <label for="newPassword" class="form-label">Nueva Contraseña</label>
        <div class="relative">
          <input
            id="newPassword"
            [type]="showNewPassword ? 'text' : 'password'"
            placeholder="Ingrese su nueva contraseña"
            formControlName="newPassword"
            class="form-input"
            [class.border-red-500]="getError('newPassword')">
          <button
            type="button"
            (click)="toggleNewPasswordVisibility()"
            class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-gray-700"
            tabindex="-1">
            @if (showNewPassword) {
              <!-- Icono ojo cerrado -->
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            } @else {
              <!-- Icono ojo abierto -->
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            }
          </button>
        </div>
        @if (getError('newPassword')) {
          <p class="form-error">{{ getError('newPassword') }}</p>
        }
      </fieldset>

      <fieldset class="form-field">
        <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
        <div class="relative">
          <input
            id="confirmPassword"
            [type]="showConfirmPassword ? 'text' : 'password'"
            placeholder="Confirme su contraseña"
            formControlName="confirmPassword"
            class="form-input"
            [class.border-red-500]="getError('confirmPassword')">
          <button
            type="button"
            (click)="toggleConfirmPasswordVisibility()"
            class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-gray-700"
            tabindex="-1">
            @if (showConfirmPassword) {
              <!-- Icono ojo cerrado -->
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            } @else {
              <!-- Icono ojo abierto -->
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            }
          </button>
        </div>
        @if (getError('confirmPassword')) {
          <p class="form-error">{{ getError('confirmPassword') }}</p>
        }
      </fieldset>

      <div style="margin-top: 32px;">
        <button 
          type="submit" 
          [disabled]="resetForm.invalid || isSubmitting()" 
          class="form-button">
          @if (isSubmitting()) {
            <span class="inline-flex items-center justify-center gap-2">
              <span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
              Guardando...
            </span>
          } @else {
            Restablecer Contraseña
          }
        </button>
      </div>
    </form>
  </div>
</section>
